<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Torvos.ca</title>
    <meta name="description" content="Torvos Personal Infrastructure - an interactive terminal with my resume, background in cloud architecture and cybersecurity, and contact details.">

    <!-- The address this page lives at. Every absolute URL below (and in
         robots.txt / sitemap.xml) uses https://torvos.ca - change them
         all together if the site ever moves. -->
    <link rel="canonical" href="https://torvos.ca/">

    <!-- A static HTML copy of the content, for crawlers, link previews
         and anything else that can't drive the terminal. Generated by
         tools/build-plain.js. -->
    <link rel="alternate" type="text/html" href="plain.html" title="Plain version (no JavaScript needed)">

    <!-- Tab icon: SVG for current browsers, PNG fallbacks for the rest. -->
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <link rel="icon" href="favicon-32.png" sizes="32x32" type="image/png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="theme-color" content="#000000">

    <!-- Link previews (Open Graph is read by LinkedIn, Slack, Discord,
         iMessage, Facebook...; the twitter: tags by X and Bluesky).
         Preview images must be absolute URLs. -->
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="Torvos.ca">
    <meta property="og:title" content="Torvos.ca">
    <meta property="og:description" content="An interactive terminal with my resume, background in cloud architecture and cybersecurity, and contact details.">
    <meta property="og:url" content="https://torvos.ca/">
    <meta property="og:image" content="https://torvos.ca/og-image.png">
    <meta property="og:image:width" content="1200">
    <meta property="og:image:height" content="630">
    <meta property="og:image:alt" content="The Torvos.ca terminal showing its welcome banner and the commands resume, about and contact.">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Torvos.ca">
    <meta name="twitter:description" content="An interactive terminal with my resume, background in cloud architecture and cybersecurity, and contact details.">
    <meta name="twitter:image" content="https://torvos.ca/og-image.png">

    <link rel="stylesheet" href="css/terminal.css">
    <link rel="stylesheet" href="css/animations.css">

</head>

<body class="theme-green">

<div id="terminal-container">
    <main id="terminal">
        <!-- Shown only when JavaScript is off (the terminal can't run
             without it). Sits inside #terminal because #terminal-container
             covers the whole page. -->
        <noscript>
            <div class="noscript-message">
                <p>Welcome to Torvos.ca.</p>
                <p>This site is an interactive terminal, which needs JavaScript. It is turned off in your browser.</p>
                <p>Everything on the site is also available as an ordinary page: <a href="plain.html">read the plain version</a> (about, resume and contact).</p>
            </div>
        </noscript>
        <div id="output" role="log" aria-live="polite" aria-label="Terminal output"></div>
        <!-- Keep the two spans on ONE line with nothing between the tags.
             Spaces and line breaks inside #input-line are displayed (its
             CSS preserves them so typed spaces show), so any here would
             appear as blank rows around the prompt. -->
        <div id="input-line" aria-hidden="true"><span id="prompt"></span><span id="command"></span></div>
        <div id="editor-container">
            <div id="editor-header" role="status" aria-live="polite">
            </div>
            <textarea id="editor" aria-label="File editor" spellcheck="false"></textarea>
        </div>
        <div id="scroll-anchor"></div>
    </main>
</div>

<!-- Touch-only affordances for keys most virtual keyboards don't expose.
     Hidden on non-touch devices via CSS (see terminal.css). -->
<div id="mobile-toolbar">
    <button type="button" id="mobile-tab-btn" aria-label="Complete the command or file name">Tab</button>
    <button type="button" id="mobile-save-btn">Save</button>
    <button type="button" id="mobile-save-exit-btn">Save &amp; Exit</button>
    <button type="button" id="mobile-esc-btn" aria-label="Exit the editor without saving">Esc</button>
    <button type="button" id="mobile-stop-btn" aria-label="Stop the running command">Ctrl+C</button>
</div>

<input
    id="hidden-input"
    type="text"
    aria-label="Terminal command input"
    autocomplete="off"
    autocorrect="off"
    autocapitalize="off"
    spellcheck="false"
/>
